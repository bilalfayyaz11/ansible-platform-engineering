---
- name: Install and Configure MariaDB Database Server
  hosts: dbservers
  become: yes

  vars:
    mysql_port: 3306

  tasks:
    - name: Install MariaDB server and client packages
      ansible.builtin.dnf:
        name:
          - mariadb-server
          - mariadb
          - python3-PyMySQL
        state: present
      tags:
        - packages
        - database

    - name: Start and enable MariaDB service
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes
      tags:
        - services

    - name: Create database configuration file
      ansible.builtin.copy:
        content: |
          [mysql]
          port={{ mysql_port }}
          socket=/var/lib/mysql/mysql.sock

          [mysqld]
          port={{ mysql_port }}
          socket=/var/lib/mysql/mysql.sock
          datadir=/var/lib/mysql
          log-error=/var/log/mariadb/mariadb.log
          pid-file=/var/run/mariadb/mariadb.pid
        dest: /etc/my.cnf.d/custom.cnf
        owner: root
        group: root
        mode: '0644'
      notify:
        - restart mariadb
      tags:
        - configuration

  handlers:
    - name: restart mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted

---
- name: Install web server and firewall packages
  package:
    name:
      - "{{ webserver_package }}"
      - firewalld
      - curl
    state: present
  become: true

- name: Ensure document root exists
  file:
    path: "{{ webserver_document_root }}"
    state: directory
    owner: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    mode: '0755'
  become: true

- name: Deploy index page from template
  template:
    src: index.html.j2
    dest: "{{ webserver_document_root }}/{{ webserver_index_file }}"
    owner: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    mode: '0644'
  become: true
  notify: restart webserver

- name: Start and enable firewall
  systemd:
    name: "{{ firewall_service }}"
    state: started
    enabled: true
  become: true

- name: Open web server port
  ansible.posix.firewalld:
    port: "{{ webserver_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  become: true

- name: Start and enable web server
  systemd:
    name: "{{ webserver_service }}"
    state: started
    enabled: true
  become: true

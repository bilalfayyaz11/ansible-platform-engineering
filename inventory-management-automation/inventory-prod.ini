[webservers]
prod-web1 ansible_connection=local environment=production
prod-web2 ansible_connection=local environment=production
prod-web3 ansible_connection=local environment=production

[databases]
prod-db1 ansible_connection=local environment=production
prod-db2 ansible_connection=local environment=production

[loadbalancers]
prod-lb1 ansible_connection=local environment=production
prod-lb2 ansible_connection=local environment=production

[frontend:children]
webservers
loadbalancers

[backend:children]
databases

[production:children]
frontend
backend

[webservers:vars]
http_port=80
max_connections=1000
debug_mode=false

[databases:vars]
db_port=3306
db_max_connections=500
backup_enabled=true

[all:vars]
log_level=info
